# Noctalia-native theming. No Omarchy theme import: when the Noctalia
# builtin alacritty template is enabled it writes themes/noctalia.toml on
# every palette/mode change (see cachyos/noctalia/50-mydotfiles.toml); the
# installer places a static dark placeholder there until then, so this
# import never points at a missing file.
general.import = ["~/.config/alacritty/themes/noctalia.toml"]

[env]
TERM = "xterm-256color"

[font]
normal = { family = "Ubuntu Sans Mono", style = "SemiBold" }
bold   = { family = "Ubuntu Sans Mono", style = "Bold" }
italic = { family = "Ubuntu Sans Mono", style = "SemiBold Italic" }
size = 9

[window]
# Opaque: readability over glass. (Hyprland also forces terminal opacity.)
opacity = 1.0
padding.x = 80
padding.y = 20
decorations = "None"

[keyboard]
bindings = [
{ key = "F11", action = "ToggleFullscreen" },
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" }
]
